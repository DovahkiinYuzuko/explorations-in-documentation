  <g transform="translate(584, 96)">
    <rect x="0" y="0" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1A1A1C" stroke-width="1.3" />
    <rect x="0" y="8" width="4" height="56" fill="#0017C1" />
    <circle cx="34" cy="36" r="16" fill="#E8F1FE" />
    <g transform="translate(25,27) scale(0.7500)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8" /><path d="m4 17 6-6-6-6" /></g>
    <text x="60" y="30" class="f lbl">実用 CLI / ライブラリ</text>
    <text x="60" y="52" class="f sub">最短手順・比較基準・値域境界・動的I/O例</text>

    <rect x="0" y="82" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1A1A1C" stroke-width="1.3" />
    <rect x="0" y="90" width="4" height="56" fill="#0017C1" />
    <circle cx="34" cy="118" r="16" fill="#E8F1FE" />
    <g transform="translate(25,109) scale(0.7500)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11" /><line x1="8" x2="8" y1="9" y2="13" /><line x1="15" x2="15.01" y1="12" y2="12" /><line x1="18" x2="18.01" y1="10" y2="10" /><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" /></g>
    <text x="60" y="112" class="f lbl">個人トイ / エンタメアプリ</text>
    <text x="60" y="134" class="f sub">デモURL・気軽さ・親しみやすい表現を優先</text>

    <rect x="0" y="164" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1A1A1C" stroke-width="1.3" />
    <rect x="0" y="172" width="4" height="56" fill="#0017C1" />
    <circle cx="34" cy="200" r="16" fill="#E8F1FE" />
    <g transform="translate(25,191) scale(0.7500)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></g>
    <text x="60" y="194" class="f lbl">設計書 / RFC・プレーンテキスト</text>
    <text x="60" y="216" class="f sub">設計論拠・モジュール構造一致・末尾付録分離</text>
  </g>
</svg>