    <path d="M 74 0 C 122 50, 122 162, 74 212 C 26 162, 26 50, 74 0 Z" fill="#E8F1FE" stroke="#0017C1" stroke-width="1.8" />
    <g transform="translate(64,54) scale(0.8333)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></g>
    <text x="74" y="100" text-anchor="middle" class="f accent">思考の</text>
    <text x="74" y="120" text-anchor="middle" class="f accent">レンズ</text>
    <text x="74" y="144" text-anchor="middle" class="f sub">目的・読者</text>
    <text x="74" y="232" text-anchor="middle" class="f sub">書き手の自律性 (Agency)</text>
  </g>

  <g stroke="#0017C1" stroke-width="1.5" fill="none">
    <path d="M 476 185 C 516 180, 534 132, 578 132" marker-end="url(#arr)" />
    <path d="M 482 210 L 578 210" marker-end="url(#arr)" />
    <path d="M 476 235 C 516 240, 534 288, 578 288" marker-end="url(#arr)" />
