<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t3 d3">
  <title id="t3">Part III：テンプレートではなく「思考のレンズ」として</title>
  <desc id="d3">左側の5本柱の知見が、中央の「思考のレンズ（目的・読者・文脈）」を通過することで、実用CLI・個人トイ・設計書RFCの3方向へ異なる比重で引き出される構造を図解。</desc>
  <defs>
    <style>
      .f { font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif; }
      .mono { font-family: "Consolas", "DejaVu Sans Mono", monospace; }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #4D4D54; }
      .title { font-size: 17px; font-weight: 700; fill: #1A1A1C; }
      .lbl { font-size: 12.5px; font-weight: 700; fill: #1A1A1C; }
      .sub { font-size: 11px; font-weight: 500; fill: #4D4D54; }
      .accent { font-size: 12.5px; font-weight: 700; fill: #0017C1; }
      .pill { font-size: 11.5px; font-weight: 600; fill: #1A1A1C; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0017C1" /></marker>
  </defs>
  <rect x="0" y="0" width="960" height="360" fill="#FFFFFF" />
  <text x="32" y="36" class="mono kicker">PART III — CONTEXTUAL ADAPTATION (LENS, NOT TEMPLATE)</text>
  <text x="32" y="60" class="f title">固定テンプレートではなく「思考のレンズ」として引き出す</text>
  <line x1="32" y1="74" x2="928" y2="74" stroke="#757578" stroke-width="1.2" />

  <g transform="translate(32, 100)">
    <rect x="0" y="0" width="218" height="36" rx="8" fill="#F7F7F8" stroke="#757578" stroke-width="1.2" />
    <g transform="translate(12,10) scale(0.6667)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g>
    <text x="36" y="23" class="f pill">1. 視線と初動</text>

    <rect x="0" y="46" width="218" height="36" rx="8" fill="#F7F7F8" stroke="#757578" stroke-width="1.2" />
    <g transform="translate(12,56) scale(0.6667)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g>
    <text x="36" y="69" class="f pill">2. 空間構造と段階的開示</text>

    <rect x="0" y="92" width="218" height="36" rx="8" fill="#F7F7F8" stroke="#757578" stroke-width="1.2" />
    <g transform="translate(12,102) scale(0.6667)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2" /></g>
    <text x="36" y="115" class="f pill">3. 文章のリズムと呼吸</text>

    <rect x="0" y="138" width="218" height="36" rx="8" fill="#F7F7F8" stroke="#757578" stroke-width="1.2" />
    <g transform="translate(12,148) scale(0.6667)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" /><path d="m19 8 3 8a5 5 0 0 1-6 0zV7" /><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1" /><path d="m5 8 3 8a5 5 0 0 1-6 0zV7" /><path d="M7 21h10" /></g>
    <text x="36" y="161" class="f pill">4. 論理と必然性の骨格</text>

    <rect x="0" y="184" width="218" height="36" rx="8" fill="#F7F7F8" stroke="#757578" stroke-width="1.2" />
    <g transform="translate(12,194) scale(0.6667)" fill="none" stroke="#0017C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></g>
    <text x="36" y="207" class="f pill">5. 信頼・誠実さと境界開示</text>
  </g>

  <g stroke="#757578" stroke-width="1.2" fill="none">
    <path d="M 250 118 C 302 118, 326 175, 366 190" />
    <path d="M 250 164 C 302 164, 326 195, 364 202" />
    <path d="M 250 210 L 362 210" />
    <path d="M 250 256 C 302 256, 326 225, 364 218" />
    <path d="M 250 302 C 302 302, 326 245, 366 230" />
  </g>

