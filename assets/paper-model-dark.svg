<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-labelledby="tp dp">
  <title id="tp">図1：良いドキュメント設計の統合仮説モデル（3部・5本柱）</title>
  <desc id="dp">Part I（第2章 視線と初動、第3章 空間構造と形式、第4章 文章のリズムと呼吸）、Part II（第5章 論理と必然性、第6章 信頼・誠実さと境界開示）、Part III（第7章 思考のレンズとしての文脈適応と自己検証）を、読者の処理プロセス順に接続した学術論文用の統合仮説モデル図。</desc>
  <defs>
    <style>
      .f { font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans CJK JP", sans-serif; }
      .mono { font-family: "Consolas", "DejaVu Sans Mono", monospace; }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #B5B8C0; }
      .title { font-size: 16.5px; font-weight: 700; fill: #F2F2F5; }
      .part-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #70A6FF; }
      .part-name { font-size: 13px; font-weight: 700; fill: #F2F2F5; }
      .chap { font-size: 10.5px; font-weight: 700; fill: #70A6FF; }
      .node-title { font-size: 13px; font-weight: 700; fill: #F2F2F5; }
      .node-kw { font-size: 11px; font-weight: 500; fill: #B5B8C0; }
      .axis-lbl { font-size: 11px; font-weight: 700; fill: #B5B8C0; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#F2F2F5" />
    </marker>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#8C919E" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="520" fill="#111318" />

  <text x="32" y="36" class="mono kicker">FIGURE 1 — INTEGRATED HYPOTHESIS MODEL (3 PARTS / 5 PILLARS)</text>
  <text x="32" y="60" class="f title">良いドキュメント設計の統合仮説モデル（処理プロセスと関心事の分離）</text>
  <line x1="32" y1="74" x2="1008" y2="74" stroke="#767A86" stroke-width="1.5" />

  <!-- PART I -->
  <g transform="translate(32, 96)">
    <rect x="0" y="0" width="320" height="352" fill="#161920" stroke="#767A86" stroke-width="1.2" stroke-dasharray="5 3" />
    <text x="16" y="24" class="mono part-tag">PART I</text>
    <text x="72" y="24" class="f part-name">知覚・構造・リズムの設計</text>
    <line x1="16" y1="34" x2="304" y2="34" stroke="#767A86" stroke-width="1" />

    <rect x="16" y="48" width="288" height="78" fill="#1D212B" stroke="#767A86" stroke-width="1.2" />
    <rect x="16" y="48" width="4" height="78" fill="#70A6FF" />
    <text x="30" y="68" class="f chap">第2章｜柱 1</text>
    <text x="104" y="68" class="f node-title">視線と初動</text>
    <text x="30" y="90" class="f node-kw">1〜5秒の動機づけ / 上位1画面 (57%)</text>
    <text x="30" y="108" class="f node-kw">LSP定義・Why/When・Level A・結合探索抑制</text>
    <line x1="160" y1="126" x2="160" y2="146" stroke="#8C919E" stroke-width="1.3" marker-end="url(#arr-sub)" />

    <rect x="16" y="150" width="288" height="78" fill="#1D212B" stroke="#767A86" stroke-width="1.2" />
    <rect x="16" y="150" width="4" height="78" fill="#70A6FF" />
    <text x="30" y="170" class="f chap">第3章｜柱 2</text>
    <text x="104" y="170" class="f node-title">空間構造と形式設計</text>
    <text x="30" y="192" class="f node-kw">4±1チャンク保護 / 段階的開示 (3層分離)</text>
    <text x="30" y="210" class="f node-kw">箇条書き・AE文見出し・表・説明的図解</text>
    <line x1="160" y1="228" x2="160" y2="248" stroke="#8C919E" stroke-width="1.3" marker-end="url(#arr-sub)" />

    <rect x="16" y="252" width="288" height="78" fill="#1D212B" stroke="#767A86" stroke-width="1.2" />
    <rect x="16" y="252" width="4" height="78" fill="#70A6FF" />
    <text x="30" y="272" class="f chap">第4章｜柱 3</text>
    <text x="104" y="272" class="f node-title">文章のリズムと呼吸</text>
    <text x="30" y="294" class="f node-kw">音韻ループ (約2秒) / 係り受け距離・述語数</text>
    <text x="30" y="312" class="f node-kw">短文化の罠・統語ゆらぎ・問いかけの限界</text>
  </g>

  <line x1="356" y1="272" x2="388" y2="272" stroke="#F2F2F5" stroke-width="1.6" marker-end="url(#arr)" />

  <!-- PART II -->
  <g transform="translate(392, 96)">
    <rect x="0" y="0" width="320" height="352" fill="#161920" stroke="#767A86" stroke-width="1.2" stroke-dasharray="5 3" />
    <text x="16" y="24" class="mono part-tag">PART II</text>
    <text x="80" y="24" class="f part-name">論理と誠実さの設計</text>
    <line x1="16" y1="34" x2="304" y2="34" stroke="#767A86" stroke-width="1" />

    <rect x="16" y="64" width="288" height="106" fill="#1D212B" stroke="#767A86" stroke-width="1.2" />
    <rect x="16" y="64" width="4" height="106" fill="#70A6FF" />
    <text x="30" y="86" class="f chap">第5章｜柱 4</text>
    <text x="104" y="86" class="f node-title">論理と必然性の骨格</text>
    <text x="30" y="110" class="f node-kw">必然性の鎖 (FAB) / 迂回 (Detour) 除去</text>
    <text x="30" y="130" class="f node-kw">背理法 (RAA) と結果論証 (トレードオフ) の峻別</text>
    <text x="30" y="150" class="f node-kw">ヒュームのギロチン：is と ought の分離</text>
    <line x1="160" y1="170" x2="160" y2="202" stroke="#8C919E" stroke-width="1.3" marker-end="url(#arr-sub)" />

    <rect x="16" y="206" width="288" height="114" fill="#1D212B" stroke="#767A86" stroke-width="1.2" />
    <rect x="16" y="206" width="4" height="114" fill="#70A6FF" />
    <text x="30" y="228" class="f chap">第6章｜柱 5</text>
    <text x="104" y="228" class="f node-title">信頼・誠実さと境界開示</text>
    <text x="30" y="252" class="f node-kw">コスト高シグナル（比較基準・再現コマンド）</text>
    <text x="30" y="272" class="f node-kw">反論あり両面提示（制約事実＋理由＋代替策）</text>
    <text x="30" y="292" class="f node-kw">値域境界・動的I/O具体例・読者熟練度差</text>
  </g>

  <line x1="716" y1="272" x2="748" y2="272" stroke="#F2F2F5" stroke-width="1.6" marker-end="url(#arr)" />

  <!-- PART III -->
  <g transform="translate(752, 96)">
    <rect x="0" y="0" width="256" height="352" fill="#111318" stroke="#70A6FF" stroke-width="1.6" />
    <text x="16" y="24" class="mono part-tag">PART III</text>
    <text x="86" y="24" class="f part-name">文脈適応と自己検証</text>
    <line x1="16" y1="34" x2="240" y2="34" stroke="#70A6FF" stroke-width="1" />

    <rect x="16" y="54" width="224" height="148" fill="#13223D" stroke="#70A6FF" stroke-width="1.2" />
    <text x="28" y="76" class="f chap">第7.1節</text>
    <text x="84" y="76" class="f node-title">思考のレンズ</text>
    <text x="28" y="100" class="f node-kw">画一的テンプレートの否定</text>
    <text x="28" y="118" class="f node-kw">Authorial Agency (自律性)</text>
    <line x1="28" y1="130" x2="228" y2="130" stroke="#767A86" stroke-width="0.8" />
    <text x="28" y="148" class="f node-kw">・CLI / ライブラリ（手順・I/O）</text>
    <text x="28" y="166" class="f node-kw">・個人トイ（デモ・気軽さ）</text>
    <text x="28" y="184" class="f node-kw">・設計書 / RFC（論拠・付録）</text>

    <rect x="16" y="218" width="224" height="112" fill="#161920" stroke="#767A86" stroke-width="1.2" />
    <text x="28" y="240" class="f chap">第7.2節</text>
    <text x="84" y="240" class="f node-title">モデルの境界条件</text>
    <text x="28" y="264" class="f node-kw">・統合モデル全体は未実証</text>
    <text x="28" y="284" class="f node-kw">・情緒的エッセイ・物語は対象外</text>
    <text x="28" y="304" class="f node-kw">・書き手の検証・維持コスト増</text>
  </g>

  <line x1="32" y1="472" x2="1004" y2="472" stroke="#8C919E" stroke-width="1.2" marker-end="url(#arr-sub)" />
  <text x="192" y="494" text-anchor="middle" class="f axis-lbl">1. 読みやすさの基盤（認知資源の保護）</text>
  <text x="552" y="494" text-anchor="middle" class="f axis-lbl">2. 納得と信頼の基盤（飛躍と曖昧さの抑制）</text>
  <text x="880" y="494" text-anchor="middle" class="f axis-lbl">3. 文脈に応じた自律的適用</text>
</svg>
